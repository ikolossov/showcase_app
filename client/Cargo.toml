[package]
name = "showcase"
version = "1.0.0"
edition = "2024"
publish = false

[features]
default = ["tls", "x11", "wayland"]
# HTTPS (rustls + webpki-roots). Без него бинарник меньше, но только http://.
tls = ["ureq/rustls"]
# Оконные бэкенды Linux (на Windows/macOS не влияют).
x11 = ["eframe/x11"]
wayland = ["eframe/wayland"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow"] }
epaint_default_fonts = "0.36"
ureq = { version = "3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
qrcodegen = "1.8"
sha2 = "0.11"
dirs = "7"
self-replace = "1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
